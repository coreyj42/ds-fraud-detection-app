[tool.poetry]
name = "ds-fraud-detection-app"
version = "1.2.0"
description = ""
authors = ["Corey Jenkins <corey.jenkins@roadsurfer.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pytest = "^8.3.3"
black = "^24.10.0"
flake8 = "^7.1.1"
ds-package-classifier = {version = "1.0.1", source = "ds-packages"}
ds-package-gcp = {version = "1.0.0", source = "ds-packages"}
pandas = "^2.3.3"
google-cloud-bigquery = "^3.38.0"
db-dtypes = "^1.4.3"
google-cloud-bigquery-storage = "^2.33.1"
country-converter = "^1.3.1"
gcsfs = "^2026.3.0"
google-cloud-aiplatform = "^1.121.0"
pyyaml = "^6.0.3"
pandas-gbq = "^0.29.2"

[[tool.poetry.source]]
name = "ds-packages"
url = "https://europe-west3-python.pkg.dev/sf-da-dwh/ds-packages/simple"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
