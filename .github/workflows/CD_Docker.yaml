# USAGE:
#   You need to set your GCP_PROJECT_ID and GCP_SA_KEY in the repos Secrets - Actions
#   The key is the whole .json service account keyfile
#   Reduce that .json file to a single line to prevent issues
name: Build Docker image and upload to GCP Artifact Registry

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.11'

    - name: Authorize the below actions
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker europe-west3-docker.pkg.dev

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and upload Base image using repository secret
      run: |
        export DOCKER_BUILDKIT=1
        echo "$(gcloud auth print-access-token)" | docker buildx build \
          --secret id=gcp_token,src=/dev/stdin \
          -t europe-west3-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/ds-images/ds-classifier-base:latest . \
          --push
